{% extends "base.html" %}

{% block content %}
    <h1 id="tool-title">OptiExchange Converter</h1>
    
    <div class="tool-selector">
        <button class="tool-tab {% if selected_tool == 'converter' %}active{% else %}inactive{% endif %}" data-tool="converter">
            <i class="fas fa-calculator"></i> <span class="tab-text">Converter</span>
        </button>
        <button class="tool-tab {% if selected_tool == 'predictor' %}active{% else %}inactive{% endif %}" data-tool="predictor">
            <i class="fas fa-chart-line"></i> <span class="tab-text">Predictor</span>
        </button>
        <button class="tool-tab {% if selected_tool == 'trends' %}active{% else %}inactive{% endif %}" data-tool="trends">
            <i class="fas fa-history"></i> <span class="tab-text">Trends</span>
        </button>
    </div>
    
    <!-- CONVERTER TOOL -->
    <div class="tool-container {% if selected_tool == 'converter' %}active{% endif %}" id="converter-tool">
        <div class="converter-row">
            <input type="number" class="converter-input" id="amount" placeholder="Enter amount" min="0" step="0.01" value="33.99">
            <select class="converter-select" id="from-currency">
                <option value="" disabled>Select Currency</option>
                {% for curr in currencies %}
                    <option value="{{ curr }}" {% if curr == 'GBP' %}selected{% endif %}>{{ curr }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="converter-row">
            <input type="number" class="converter-input" id="converted-amount" placeholder="Result" readonly>
            <select class="converter-select" id="to-currency">
                <option value="" disabled>Select Currency</option>
                {% for curr in currencies %}
                    <option value="{{ curr }}" {% if curr == 'CHF' %}selected{% endif %}>{{ curr }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button class="converter-swap" id="swap-currencies" title="Swap currencies">
            <i class="fas fa-exchange-alt"></i>
        </button>
        
        <div class="converter-result" id="conversion-rate"></div>
    </div>
    
    <!-- PREDICTOR TOOL -->
    <div class="tool-container {% if selected_tool == 'predictor' %}active{% endif %}" id="predictor-tool">
        <form method="POST" action="/predict" id="prediction-form">
            <div class="form-group">
                <label for="currency">Select Currency:</label>
                <div class="select-wrapper">
                    <select name="currency" id="currency" required>
                        <option value="" disabled {% if not selected_currency %}selected{% endif %}>Select Currency</option>
                        {% for curr in currencies %}
                            <option value="{{ curr }}" {% if selected_currency == curr %}selected{% endif %}>{{ curr }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="date">Select Date:</label>
                <div class="date-wrapper">
                    <input type="date" id="date" name="date" required>
                </div>
            </div>
            
            <button type="submit" class="predict-rate-btn">
                <i class="fas fa-chart-line"></i> Predict Rate
            </button>
        </form>
        
        {% if request.method == 'POST' and prediction %}
            <div class="result" id="prediction-result">
                <strong>Exchange Rate:</strong> {{ prediction }}
            </div>
        {% endif %}
    </div>
    
    <!-- TRENDS TOOL -->
    <div class="tool-container {% if selected_tool == 'trends' %}active{% endif %}" id="trends-tool">
        <div class="form-group">
            <label for="chart-from-currency">From Currency:</label>
            <div class="select-wrapper">
                <select id="chart-from-currency" class="converter-select">
                    <option value="" disabled selected>Select Currency</option>
                    {% for curr in currencies %}
                        <option value="{{ curr }}">{{ curr }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="chart-to-currency">To Currency:</label>
            <div class="select-wrapper">
                <select id="chart-to-currency" class="converter-select">
                    <option value="" disabled selected>Select Currency</option>
                    {% for curr in currencies %}
                        <option value="{{ curr }}">{{ curr }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="chart-year">Year:</label>
            <div class="select-wrapper">
                <select id="chart-year" class="converter-select">
                    <option value="" disabled selected>Select Year</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                </select>
            </div>
        </div>
        
        <button id="update-chart" class="update-chart-btn">
            <i class="fas fa-sync-alt"></i> View Chart
        </button>
        
        <div class="chart-container">
            <canvas id="historyChart"></canvas>
        </div>
    </div>
{% endblock %}

{% block extra_css %}
<style>
    .container {
        max-width: 600px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    body.dark .container {
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .tool-selector {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
        gap: 8px;
    }

    .tool-tab {
        padding: 10px 15px;
        background: var(--tab-inactive);
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        color: var(--text-light);
        font-size: 0.95rem;
        border: none;
        flex: 1;
        text-align: center;
        max-width: 150px;
        transform: translateY(0);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }

    .tool-tab:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    body.dark .tool-tab {
        background: rgba(79, 70, 229, 0.2);
        color: var(--text-dark);
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    body.dark .tool-tab:hover {
        box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }

    .tool-tab.active {
        background: var(--accent);
        color: white;
        transform: translateY(0);
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .tool-container {
        display: none;
        animation: fadeIn 0.3s ease;
    }

    .tool-container.active {
        display: block;
    }

    .tab-text {
        display: inline;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .converter-row {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        align-items: center;
    }

    .converter-input {
        flex: 2;
        padding: 12px 15px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
        background-color: var(--input-light);
        color: var(--text-light);
        transition: all 0.3s ease;
        min-height: 44px;
    }

    body.dark .converter-input {
        background-color: var(--input-dark);
        color: var(--text-dark);
        border-color: #555;
    }

    .converter-select {
        flex: 1;
        padding: 12px 15px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
        background-color: var(--input-light);
        color: var(--text-light);
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        transition: all 0.3s ease;
        min-height: 44px;
    }

    body.dark .converter-select {
        background-color: var(--input-dark);
        color: var(--text-dark);
        border-color: #555;
    }

    .converter-result {
        font-size: 0.95rem;
        text-align: center;
        margin: 15px 0;
        color: var(--accent);
        padding: 10px;
        background: rgba(79, 70, 229, 0.08);
        border-radius: 8px;
    }

    .converter-swap {
        background: var(--accent);
        color: white;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 5px auto;
        transition: all 0.3s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        -webkit-tap-highlight-color: transparent;
    }

    .converter-swap:hover {
        transform: rotate(180deg) scale(1.1);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .form-group {
        margin-bottom: 18px;
    }

    .select-wrapper, .date-wrapper {
        position: relative;
    }

    .select-wrapper::after {
        content: "▼";
        font-size: 12px;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        position: absolute;
        pointer-events: none;
        color: var(--text-light);
    }

    body.dark .select-wrapper::after {
        color: var(--text-dark);
    }

    .result {
        background-color: #d1fae5;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        text-align: center;
        font-size: 15px;
        color: #065f46;
        transition: all 0.3s ease;
    }

    body.dark .result {
        background-color: #059669;
        color: #d1fae5;
    }

    .chart-container {
        height: 280px;
        margin-top: 15px;
        display: none;
    }

    .chart-container.visible {
        display: block;
    }

    .update-chart-btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 15px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 44px;
        -webkit-tap-highlight-color: transparent;
    }

    .update-chart-btn:hover {
        background: #4338ca;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .update-chart-btn:active {
        transform: translateY(0);
    }

    .predict-rate-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    @media (max-width: 768px) {
        .container {
            padding: 20px;
        }

        .tool-selector {
            flex-direction: column;
            gap: 8px;
        }

        .tool-tab {
            max-width: 100%;
            padding: 12px;
        }

        .tool-tab:hover {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    }

    @media (max-width: 480px) {
        .converter-row, .form-group {
            flex-direction: column;
        }
        
        .converter-input, .converter-select {
            width: 100%;
        }
        
        .tab-text {
            display: none;
        }
        
        .tool-tab {
            padding: 10px;
        }
        
        .tool-tab i {
            margin-right: 0;
        }
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    function switchTool(toolName) {
        const tabs = document.querySelectorAll('.tool-tab');
        const containers = document.querySelectorAll('.tool-container');
        const title = document.getElementById('tool-title');

        tabs.forEach(t => t.classList.remove('active'));
        containers.forEach(c => c.classList.remove('active'));

        const targetTab = document.querySelector(`.tool-tab[data-tool="${toolName}"]`);
        const targetContainer = document.getElementById(`${toolName}-tool`);

        if (targetTab && targetContainer) {
            targetTab.classList.add('active');
            targetContainer.classList.add('active');

            if (toolName === 'converter') {
                title.textContent = 'OptiExchange Converter';
            } else if (toolName === 'predictor') {
                title.textContent = 'Currency Predictions';
            } else if (toolName === 'trends') {
                title.textContent = 'OptiExchange Charts';
            }

            if (toolName === 'trends') {
                document.querySelector('.chart-container').classList.remove('visible');
                if (chart) {
                    chart.destroy();
                    chart = null;
                }
            }
        }
    }

    document.querySelectorAll('.tool-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            switchTool(tab.dataset.tool);
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        const selectedTool = "{{ selected_tool or 'converter' }}";
        switchTool(selectedTool);
        
        // Trigger initial conversion on page load
        setTimeout(convertCurrency, 100);
    });

    // ============ CURRENCY CONVERTER ============
    const convertCurrency = async () => {
        const amount = parseFloat(document.getElementById('amount').value);
        const from = document.getElementById('from-currency').value;
        const to = document.getElementById('to-currency').value;

        if (isNaN(amount) || amount <= 0) {
            document.getElementById('converted-amount').value = '';
            document.getElementById('conversion-rate').textContent = '❌ Please enter a valid amount';
            return;
        }

        if (!from || !to) {
            document.getElementById('converted-amount').value = '';
            document.getElementById('conversion-rate').textContent = '❌ Please select currencies';
            return;
        }

        try {
            const response = await fetch(`/api/convert?from=${from}&to=${to}&amount=${amount}`);
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Conversion failed');
            }
            
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('converted-amount').value = data.converted_amount.toFixed(4);
                document.getElementById('conversion-rate').textContent = 
                    `✅ ${amount} ${from} = ${data.converted_amount.toFixed(4)} ${to} (Rate: ${data.rate})`;
            } else {
                document.getElementById('conversion-rate').textContent = `❌ ${data.error}`;
                document.getElementById('converted-amount').value = '';
            }
        } catch (error) {
            console.error("Conversion error:", error);
            document.getElementById('conversion-rate').textContent = "❌ Failed to convert. Please try again.";
            document.getElementById('converted-amount').value = '';
        }
    };

    document.getElementById('amount').addEventListener('input', convertCurrency);
    document.getElementById('from-currency').addEventListener('change', convertCurrency);
    document.getElementById('to-currency').addEventListener('change', convertCurrency);

    document.getElementById('swap-currencies').addEventListener('click', () => {
        const from = document.getElementById('from-currency');
        const to = document.getElementById('to-currency');
        if (from.value && to.value) {
            [from.value, to.value] = [to.value, from.value];
            convertCurrency();
        }
    });

    // ============ TRENDS CHART ============
    let chart;

    async function initChart() {
        const fromCurrency = document.getElementById('chart-from-currency').value;
        const toCurrency = document.getElementById('chart-to-currency').value;
        const year = document.getElementById('chart-year').value;
        const chartContainer = document.querySelector('.chart-container');
        const canvas = document.getElementById('historyChart');

        if (!canvas || !canvas.getContext) {
            return;
        }

        if (!fromCurrency || !toCurrency || !year) {
            chartContainer.classList.remove('visible');
            alert('Please select both currencies and a year');
            return;
        }

        if (fromCurrency === toCurrency) {
            chartContainer.classList.remove('visible');
            alert('Please select different currencies');
            return;
        }

        chartContainer.classList.add('visible');
        canvas.style.opacity = '0.5';
        
        try {
            const response = await fetch(`/api/trends?from=${fromCurrency}&to=${toCurrency}&year=${year}`);
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Failed to fetch trend data');
            }
            
            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || 'No data available');
            }

            const labels = data.dates.map(date => {
                const d = new Date(date);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });

            if (chart) {
                chart.destroy();
            }

            const ctx = canvas.getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${fromCurrency}/${toCurrency} Exchange Rate (${year})`,
                        data: data.rates,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: getComputedStyle(document.body).getPropertyValue('--text-light') || '#333'
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    return `Rate: ${context.parsed.y.toFixed(4)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                maxRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 12,
                                color: getComputedStyle(document.body).getPropertyValue('--text-light') || '#333'
                            }
                        },
                        y: {
                            beginAtZero: false,
                            grid: { color: 'rgba(0, 0, 0, 0.05)' },
                            ticks: {
                                color: getComputedStyle(document.body).getPropertyValue('--text-light') || '#333',
                                callback: function(value) {
                                    return value.toFixed(4);
                                }
                            }
                        }
                    }
                }
            });
            
            canvas.style.opacity = '1';
        } catch (error) {
            console.error("Chart error:", error);
            canvas.style.opacity = '1';
            if (chart) {
                chart.destroy();
                chart = null;
            }
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '14px Arial';
            ctx.fillStyle = '#ef4444';
            ctx.textAlign = 'center';
            ctx.fillText(error.message, canvas.width / 2, canvas.height / 2);
        }
    }

    document.getElementById('update-chart').addEventListener('click', initChart);

    document.getElementById('chart-from-currency').addEventListener('change', () => {
        document.querySelector('.chart-container').classList.remove('visible');
        if (chart) {
            chart.destroy();
            chart = null;
        }
    });

    document.getElementById('chart-to-currency').addEventListener('change', () => {
        document.querySelector('.chart-container').classList.remove('visible');
        if (chart) {
            chart.destroy();
            chart = null;
        }
    });

    document.getElementById('chart-year').addEventListener('change', () => {
        document.querySelector('.chart-container').classList.remove('visible');
        if (chart) {
            chart.destroy();
            chart = null;
        }
    });
</script>
{% endblock %}

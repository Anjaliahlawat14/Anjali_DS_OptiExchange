{% extends "base.html" %}

{% block title %}Find Exchange Providers - OptiExchange{% endblock %}

{% block content %}
<h1>Exchange Providers</h1>

<div class="form-group">
    <label for="location">📍 Search Location:</label>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="location" class="converter-input" placeholder="Enter city, address, or landmark..." style="flex: 3;">
        <button id="search-btn" class="update-chart-btn" style="flex: 1; margin: 0;">
            <i class="fas fa-search"></i> Search
        </button>
    </div>
</div>

<div class="form-group">
    <button id="current-location-btn" class="update-chart-btn" style="background: #10b981;">
        <i class="fas fa-location-dot"></i> Use My Current Location
    </button>
</div>

<div id="map" style="height: 400px; margin-top: 20px; border-radius: 8px; display: none;"></div>

<div id="results" style="margin-top: 20px;"></div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #results {
        margin-top: 20px;
    }
    
    .exchange-item {
        background-color: var(--input-light);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid #d1d5db;
    }
    
    body.dark .exchange-item {
        background-color: var(--input-dark);
        border-color: #555;
    }
    
    .exchange-name {
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 8px;
    }
    
    .exchange-address {
        font-size: 14px;
        color: var(--text-light);
        margin: 5px 0;
    }
    
    body.dark .exchange-address {
        color: var(--text-dark);
    }
    
    .exchange-hours {
        font-size: 13px;
        color: #6b7280;
        margin: 5px 0;
    }
    
    body.dark .exchange-hours {
        color: #9ca3af;
    }
    
    .error-message {
        background-color: var(--error-bg-light);
        color: var(--error-text-light);
        padding: 12px;
        border-radius: 8px;
        text-align: center;
    }
    
    body.dark .error-message {
        background-color: var(--error-bg-dark);
        color: var(--error-text-dark);
    }
    
    .loading {
        text-align: center;
        padding: 40px;
    }
    
    .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid var(--accent);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .note {
        margin-top: 15px;
        padding: 10px;
        background-color: #fef3c7;
        border-radius: 6px;
        color: #92400e;
        font-size: 13px;
        text-align: center;
    }
    
    body.dark .note {
        background-color: #78350f;
        color: #fef3c7;
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map = null;
    let markers = [];

    async function findExchanges(lat, lon, locationName) {
        const resultsDiv = document.getElementById('results');
        const mapDiv = document.getElementById('map');
        
        resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching for exchange providers...</p></div>';
        
        try {
            const response = await fetch(`/api/nearby_exchanges?lat=${lat}&lng=${lon}&radius=2000`);
            const data = await response.json();
            
            if (data.success) {
                // Initialize or update map
                if (!map) {
                    mapDiv.style.display = 'block';
                    map = L.map('map').setView([lat, lon], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);
                } else {
                    map.setView([lat, lon], 14);
                    // Clear existing markers
                    markers.forEach(marker => marker.remove());
                    markers = [];
                }
                
                // Build results HTML
                let resultsHtml = `<h3>📍 Exchange Providers near ${locationName}</h3>`;
                resultsHtml += `<p>Found ${data.count} location${data.count !== 1 ? 's' : ''}</p>`;
                
                data.exchanges.forEach((exchange, index) => {
                    // Add marker to map
                    const marker = L.marker([exchange.lat, exchange.lon]).addTo(map);
                    marker.bindPopup(`
                        <b>${exchange.name}</b><br>
                        📍 ${exchange.address}<br>
                        🕒 ${exchange.opening_hours}<br>
                        📞 ${exchange.phone}
                    `);
                    markers.push(marker);
                    
                    // Add to results list
                    resultsHtml += `
                        <div class="exchange-item">
                            <div class="exchange-name">${exchange.name}</div>
                            <div class="exchange-address">📍 ${exchange.address}</div>
                            <div class="exchange-hours">🕒 ${exchange.opening_hours}</div>
                            <div class="exchange-hours">📞 ${exchange.phone}</div>
                        </div>
                    `;
                });
                
                if (data.note) {
                    resultsHtml += `<div class="note">ℹ️ ${data.note}</div>`;
                }
                
                resultsDiv.innerHTML = resultsHtml;
            } else {
                resultsDiv.innerHTML = `<div class="error-message">❌ ${data.error}</div>`;
            }
        } catch (error) {
            console.error("Exchange finder error:", error);
            resultsDiv.innerHTML = '<div class="error-message">❌ Failed to find exchange providers. Please try again.</div>';
        }
    }

    async function searchLocation() {
        const location = document.getElementById('location').value;
        if (!location) {
            alert('Please enter a location');
            return;
        }
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching for location...</p></div>';
        
        try {
            const geoResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}&limit=1`);
            const geoData = await geoResponse.json();
            
            if (geoData.length === 0) {
                resultsDiv.innerHTML = '<div class="error-message">❌ Location not found. Please try a different address.</div>';
                return;
            }
            
            const lat = parseFloat(geoData[0].lat);
            const lon = parseFloat(geoData[0].lon);
            const displayName = geoData[0].display_name.split(',')[0];
            
            await findExchanges(lat, lon, displayName);
        } catch (error) {
            console.error("Geocoding error:", error);
            resultsDiv.innerHTML = '<div class="error-message">❌ Error finding location. Please try again.</div>';
        }
    }

    function useCurrentLocation() {
        if (!navigator.geolocation) {
            alert('Geolocation is not supported by your browser');
            return;
        }
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Getting your location...</p></div>';
        
        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                await findExchanges(lat, lon, 'your current location');
            },
            (error) => {
                let errorMsg = 'Unable to get your location. ';
                if (error.code === 1) {
                    errorMsg += 'Please allow location access.';
                } else {
                    errorMsg += 'Please try searching for a location instead.';
                }
                resultsDiv.innerHTML = `<div class="error-message">❌ ${errorMsg}</div>`;
            }
        );
    }

    // Initialize event listeners
    document.addEventListener('DOMContentLoaded', () => {
        const searchBtn = document.getElementById('search-btn');
        const currentLocationBtn = document.getElementById('current-location-btn');
        const locationInput = document.getElementById('location');
        
        if (searchBtn) {
            searchBtn.addEventListener('click', searchLocation);
        }
        
        if (currentLocationBtn) {
            currentLocationBtn.addEventListener('click', useCurrentLocation);
        }
        
        if (locationInput) {
            locationInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchLocation();
                }
            });
        }
    });
</script>
{% endblock %}
